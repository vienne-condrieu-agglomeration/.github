name: Signaler un problème
description: Un module ne fonctionne pas comme prévu
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. Ce projet est mené bénévolement : plus le signalement est précis, plus il a de chances d'être traité vite.
  - type: input
    id: version-module
    attributes:
      label: Version du module
      description: Visible dans le module (lien « v… · Nouveautés ») ou dans `plugin.geoext.json`.
      placeholder: "1.8.2"
    validations:
      required: true
  - type: input
    id: version-geo
    attributes:
      label: Version de GEO (Générateur et application)
      placeholder: "4.5.0"
    validations:
      required: true
  - type: textarea
    id: constat
    attributes:
      label: Ce qui se passe
      description: Ce que vous voyez, et ce que vous attendiez.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Pour reproduire
      description: Les étapes, les réglages du module dans le Générateur, les couches ou données concernées.
      placeholder: |
        1. Ouvrir l'application
        2. Cliquer sur…
        3. …
  - type: textarea
    id: console
    attributes:
      label: Message de la console du navigateur
      description: Touche F12, onglet « Console ». Les modules préfixent leurs messages par `[nom-du-module]`.
      render: text
  - type: input
    id: navigateur
    attributes:
      label: Navigateur et version
      placeholder: "Firefox 140"
